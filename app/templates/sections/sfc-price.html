{% include 'partials/page_head.html' %}

<div class="container-fluid">
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-auto">
                    <label for="sfc_start_date" class="form-label">Start Date</label>
                    <input type="date" id="sfc_start_date" class="form-control">
                </div>
                <div class="col-auto">
                    <label for="sfc_end_date" class="form-label">End Date</label>
                    <input type="date" id="sfc_end_date" class="form-control">
                </div>
                <div class="col-auto">
                    <button id="load_sfc_chart" class="btn btn-primary">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        <span class="button-content">Load</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="card mb-3">
        <div class="card-body">
            <div id="sfc_line_chart"></div>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <div id="sfc_heatmap"></div>
        </div>
    </div>
</div>
