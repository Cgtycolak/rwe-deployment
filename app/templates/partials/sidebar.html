<nav class="sidebar" aria-label="Dashboard sections">
    <div class="sidebar-header">
        <h1><a href="#home" class="home-link" data-section="home">RWE Dashboard</a></h1>
        <div class="sidebar-controls">
            <button type="button" class="toggle-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar" aria-expanded="true">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <a href="{{ url_for('pages.logout') }}" class="logout-btn" title="Log out" aria-label="Log out">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
            </a>
        </div>
    </div>

    {% for group in nav_groups %}
        {% if group.label %}<div class="nav-category">{{ group.label }}</div>{% endif %}
        {% for section in group.sections %}{% include 'partials/nav_item.html' %}{% endfor %}
    {% endfor %}
</nav>
