{% extends 'base.html' %}

{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
{% endblock %}

{% block body %}
<div class="container-fluid">
    {% for group in nav_groups %}{% for section in group.sections %}
    <div class="content-section" data-section="{{ section.id }}">
        {% include 'sections/' ~ section.id ~ '.html' %}
    </div>
    {% endfor %}{% endfor %}
</div>
{% endblock %}

{% block page_scripts %}
<script id="endpoints-data" type="application/json">{{ urls|tojson }}</script>
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
