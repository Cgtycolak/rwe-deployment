<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - RWE Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body class="error-page">
    <main class="error-panel">
        <p class="error-code">{% block code %}{% endblock %}</p>
        <h1>{{ self.title() }}</h1>
        <p>{% block message %}{% endblock %}</p>
        <a href="{{ url_for('pages.index') }}">Back to the dashboard</a>
    </main>
</body>
</html>
