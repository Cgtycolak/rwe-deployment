services:
  # Web service
  - type: web
    name: flask-energy-app
    env: python
    buildCommand: |
      pip install -r requirements.txt
      export FLASK_APP=app
      flask db upgrade
    startCommand: gunicorn --config gunicorn_config.py wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRODUCTION_DATABASE_URL
        fromDatabase:
          name: rwe-postgres
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: rwe-postgres
          property: connectionString
      - key: USE_LOCAL_DB
        value: false
      - key: FLASK_APP
        value: app
      # EPIAS API credentials
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      # Session / auth
      - key: SECRET_KEY
        sync: false
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      # CORS — set to the deployed frontend origin
      - key: ALLOWED_ORIGINS
        sync: false
      # Supabase analytics store
      - key: SUPABASE_USER
        sync: false
      - key: SUPABASE_PASSWORD
        sync: false
      # Meteologica solar data
      - key: XTRADERS_USERNAME
        sync: false
      - key: XTRADERS_PASSWORD
        sync: false
      # Modal.com Chronos inference endpoint
      - key: MODAL_CHRONOS_URL
        sync: false
      # Email reports
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECIPIENT_EMAILS
        sync: false

  # NOTE: there is deliberately no separate scheduler worker service.
  # Commit 2c1f8fe moved the scheduler into the web service (factory.py calls
  # init_scheduler, guarded by a .scheduler.lock flock so only one gunicorn
  # worker starts it) and deleted scheduler_service.py. The old worker block
  # that ran `python scheduler_service.py` was left behind pointing at that
  # deleted file and has now been removed too.
  #
  # Do NOT reintroduce a worker service without first gating the web service's
  # init_scheduler call: the flock is per-container, so a worker in its own
  # container would start a SECOND scheduler, producing duplicate daily emails
  # and two concurrent populate_multiple_types runs racing on the same rows.

databases:
  - name: rwe-postgres
    databaseName: rwe_data
    user: rwe_user
    plan: free
    # WARNING: ipAllowList: [] allows connections from all IPs.
    # Migrate to Render Private Networking (dashboard → Database → Private URL)
    # so only services in this account can reach the DB port.
    ipAllowList: []
